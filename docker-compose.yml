services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cafe_pos}
    ports:
      # Bind ke loopback: dev lokal tetap bisa akses, jaringan luar tidak.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cafe_pos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/cafe_pos?schema=public}
      # GANTI lewat .env / environment production
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_generate_a_long_random_secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SKIP_MIGRATE: ${SKIP_MIGRATE:-0}
      # Kredensial seed — WAJIB diisi di .env. Fail-fast dicek di entrypoint
      # sebelum migrate/seed jalan (lihat backend/docker-entrypoint.sh).
      # Catatan: hindari sintaks `${VAR:?msg}` di file ini — memicu false
      # positive "Generic Password" pada GitGuardian (PR check gagal).
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_CASHIER_USERNAME: ${SEED_CASHIER_USERNAME:-kasir1}
      SEED_CASHIER_PASSWORD: ${SEED_CASHIER_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  pgdata:
